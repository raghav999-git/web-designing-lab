<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes App</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f4f4f4; }
  .container { max-width: 600px; margin: 40px auto; padding: 20px; }
  h1 { text-align: center; color: #222; margin-bottom: 20px; }
  .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
  input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; }
  button { padding: 10px 15px; background: #222; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
  button:hover { background: #f4a261; }
  .note { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .note p { flex: 1; margin-right: 10px; }
  .btns button { margin-left: 5px; font-size: 12px; }
  .edit-btn { background: #2a9d8f; }
  .del-btn { background: #e63946; }
</style>
</head>
<body>
  <div id="root"></div>

<script type="text/babel">
  const { useState } = React;

  function App() {
    const [notes, setNotes] = useState([]);
    const [text, setText] = useState("");

    const addNote = () => {
      if (text.trim() === "") { alert("Please enter a note!"); return; }
      setNotes([...notes, { id: Date.now(), text: text }]);
      setText("");
    };

    const updateNote = (id) => {
      const newText = prompt("Edit your note:");
      if (newText && newText.trim() !== "") {
        setNotes(notes.map(n => n.id === id ? { ...n, text: newText } : n));
      }
    };

    const deleteNote = (id) => {
      setNotes(notes.filter(n => n.id !== id));
    };

    return (
      <div className="container">
        <h1>My Notes App</h1>

        <div className="input-group">
          <input type="text" value={text} placeholder="Write a new note..."
                 onChange={(e) => setText(e.target.value)} />
          <button onClick={addNote}>Add</button>
        </div>

        {notes.map(n => (
          <div className="note" key={n.id}>
            <p>{n.text}</p>
            <div className="btns">
              <button className="edit-btn" onClick={() => updateNote(n.id)}>Edit</button>
              <button className="del-btn" onClick={() => deleteNote(n.id)}>Delete</button>
            </div>
          </div>
        ))}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
